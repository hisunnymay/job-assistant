services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_assistant
      POSTGRES_USER: job_assistant
      POSTGRES_PASSWORD: job_assistant
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_assistant -d job_assistant"]
      interval: 1s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
