services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_assistant
      POSTGRES_USER: job_assistant
      POSTGRES_PASSWORD: job_assistant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_assistant -d job_assistant"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - job_assistant_postgres:/var/lib/postgresql/data

volumes:
  job_assistant_postgres:
