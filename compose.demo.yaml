services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_assistant
      POSTGRES_USER: job_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/demo.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_assistant -d job_assistant"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - demo_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.demo
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://job_assistant:${POSTGRES_PASSWORD}@database:5432/job_assistant
      FRONTEND_ORIGIN: http://localhost:${DEMO_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 2s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile.demo
      args:
        VITE_API_BASE_URL: /
    ports:
      - "${DEMO_PORT:-8080}:80"
    volumes:
      - ./deploy/secrets/demo.htpasswd:/etc/nginx/auth/demo.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  demo_postgres:
